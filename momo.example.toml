# Portable MOMO product behaviour. This file may be included in a MOC export.
# Never place credentials, listener addresses, Discord IDs, executables, or
# absolute host paths in this document.
schema_version = 1

# A minimal deployment can map conversation, memory_distillation, and
# semantic_graph_governance to one generation model and use one embedding
# model. Routes and credentials belong to the host or gateway and are not
# portable product behaviour.

# This example contains only portable policy executed by MOMO Core. Model
# routes, default characters, cross-Space read weights, write targets,
# concurrency, and retries belong to the host or to each native request.
[runtime]
memory_distillation_enabled = true
memory_distill_every_turns = 12
semantic_graph_enabled = true
nsg_govern_every_turns = 12

# Each request still uses momo.mo_state to enable or disable state projection.
[mo_state]
profile = "closed_autonomous" # v1_projection keeps the read-only v1 projector.
scene_management = true       # Keep current/scene.md current after each turn.
max_reconcile_steps = 4
max_agent_steps = 8
operation_timeout_ms = 30000
injection_mode = "active"     # shadow computes, persists, and audits without injecting.

# Experimental DDM projection. Core evaluates only explicitly authored
# dispositions and governed signals; it never derives numeric values from
# conversation prose. Missing or disabled profiles are neutral. Profiles are
# character-owned data managed through the HTTP API and carried in MOC at
# extensions/momo-ddm/profile.yaml; this file contains no profile paths.
[mo_state.ddm]
enabled = false

# The Roleplay Director is fixed product policy compiled into Core, not
# author-owned Character Card content or runtime configuration.
[roleplay]
enabled = true

# allow: apply the request value after range/capability checks.
# ignore: keep the configured/default value and report the ignored override.
# reject: reject the entire request when that value is supplied.
[request_overrides]
context_window = "ignore"
max_output_tokens = "allow"
sampling = "ignore"
instructions = "allow"
visual_description_prompt = "ignore"
tools = "allow"
allowed_parameters = [] # e.g. ["seed", "stop"], never protocol-owned fields.

# Enable image input. An image-capable conversation route receives the original
# image; a text-only route uses the host-provided logical vision fallback.
[vision]
enabled = true # This permits image input; it does not force the fallback route.
prompt = "Describe only visible facts relevant to the conversation. Do not infer identity, intent, private attributes, or illegible text." # Fallback only.

# Product prompts are compiled into MOMO Core from
# crates/momo-core/src/product_prompts/. They are not configurable here,
# transported by MOC, or replaceable while the Core process is running.
