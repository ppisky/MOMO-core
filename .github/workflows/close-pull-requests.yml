name: Pull requests are temporarily paused

on:
  pull_request_target:
    types:
      - opened
      - reopened

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Explain and close
        uses: actions/github-script@v8
        with:
          script: |
            const body = [
              "Thank you for your interest in MOMO Core.",
              "",
              "Pull requests are temporarily paused while the project interfaces and specifications are being stabilized. Please open an Issue first and describe the problem, use case, expected behavior, and compatibility impact.",
              "",
              "感谢关注 MOMO Core。项目接口与规范仍在稳定阶段，目前暂不接收 Pull Request。请先创建 Issue，说明问题、使用场景、预期行为与兼容性影响。"
            ].join("\n");

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              state: "closed"
            });
