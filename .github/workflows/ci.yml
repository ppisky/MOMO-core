name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Verify 1.0 contract fixtures
        if: runner.os != 'Windows'
        working-directory: contracts/1.0
        run: sha256sum --check SHA256SUMS
      - name: Verify 1.0 contract fixtures (Windows)
        if: runner.os == 'Windows'
        working-directory: contracts/1.0
        shell: pwsh
        run: |
          $failed = $false
          Get-Content SHA256SUMS | ForEach-Object {
            $parts = $_ -split '\s+', 2
            $expected = $parts[0].ToLowerInvariant()
            $path = $parts[1].Trim()
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash.ToLowerInvariant()
            if ($actual -ne $expected) {
              Write-Error "Contract hash mismatch: $path"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test workspace
        run: cargo test --workspace --all-features
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: MORP offline evaluation contracts (Unix)
        if: runner.os != 'Windows'
        run: bash scripts/test-morp.sh
      - name: MORP offline evaluation contracts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-morp.ps1
      - name: Save MORP offline reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morp-offline-${{ matrix.os }}
          path: |
            target/morp-offline-*/contracts.json
            target/morp-offline-*/dataset/manifest.json
            target/morp-offline-*/momo-plan.json
      - name: Build documentation
        run: cargo doc --workspace --all-features --no-deps

  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/audit@v1
        with:
          createIssues: false
