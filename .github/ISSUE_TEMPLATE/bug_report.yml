name: Bug report / 问题报告
description: Report a reproducible problem in MOMO Core / 报告可复现的 MOMO Core 问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please describe observable behavior and provide a minimal reproduction.

        感谢反馈。请描述可观察到的行为，并尽量提供最小复现。不要提交 API Key、密码、私有角色卡、真实对话或其他敏感数据。

  - type: dropdown
    id: component
    attributes:
      label: Component / 组件
      description: Which part of MOMO Core is affected? / 问题发生在哪个部分？
      options:
        - Core API / orchestration
        - Storage / SQLite
        - DMW memory
        - NSG semantic graph
        - MO State
        - MOC import or export
        - Encryption
        - Model gateway or streaming
        - Local HTTP server
        - Documentation or specification
        - Unsure / 不确定
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit / 版本或提交
      description: Use a release tag or full commit SHA. / 请填写版本标签或完整 commit SHA。
      placeholder: v0.3.0 or a48ffe7...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment / 环境
      description: Include OS, architecture, Rust version, and relevant runtime details. / 请包括操作系统、架构、Rust 版本和相关运行环境。
      placeholder: |
        OS: Windows 11 / Ubuntu 24.04 / ...
        Architecture: x86_64 / aarch64
        rustc: 1.96.1
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Problem description / 问题描述
      description: What happened, and how does it affect use of MOMO Core? / 发生了什么，对使用有什么影响？
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction / 最小复现
      description: Provide the smallest sequence, request, fixture, or code sample that reproduces the problem. / 请提供最短复现步骤、请求、测试数据或代码。
      placeholder: |
        1. Initialize Core with ...
        2. Call ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期行为
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 实际行为
      description: Include the complete error message when possible. / 如有错误信息，请尽量完整提供。
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or additional context / 脱敏日志或补充信息
      description: Remove credentials, user data, private prompts, and private file paths. / 请删除凭据、用户数据、私有提示词和私有路径。
      render: shell

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation / 确认
      options:
        - label: I searched existing issues for duplicates. / 我已经搜索过现有 Issue，确认没有重复。
          required: true
        - label: I removed secrets and private user data. / 我已经移除密钥与私有用户数据。
          required: true
