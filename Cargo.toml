[workspace]
resolver = "3"
members = [
    "crates/momo-config",
    "crates/momo-crypto",
    "crates/momo-core",
    "crates/momo-domain",
    "crates/momo-memory",
    "crates/momo-moc",
    "crates/momo-server",
    "crates/momo-storage",
]
default-members = [
    "crates/momo-config",
    "crates/momo-crypto",
    "crates/momo-core",
    "crates/momo-domain",
    "crates/momo-memory",
    "crates/momo-moc",
    "crates/momo-storage",
]

[workspace.package]
version = "0.3.2"
edition = "2024"

[workspace.dependencies]
aes-gcm = { version = "0.11.0", features = ["zeroize"] }
argon2 = { version = "0.5.3", features = ["std", "zeroize"] }
axum = "0.7.9"
base64 = "0.22.1"
chrono = { version = "0.4.45", features = ["serde"] }
crc32fast = "1.5.0"
futures-util = "0.3.33"
hex = "0.4.3"
language-tags = "0.3.2"
rand = "0.9.2"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
semver = "1.0.28"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "uuid", "chrono", "json", "migrate", "macros"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.19"
tiktoken-rs = "0.12.0"
tokio = { version = "1.53.0", features = ["full"] }
tokio-stream = "0.1.17"
toml = "1.1.3"
tower-http = { version = "0.5.2", features = ["trace"] }
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
turso = { version = "0.8.0-pre.4", default-features = false }
uuid = { version = "1.24.0", features = ["v4", "v7", "serde"] }
unicode-normalization = "0.1.25"
url = "2.5.8"
walkdir = "2.5.0"
wuff = "0.2.8"
yaml_serde = "0.10.4"
zstd = "0.13.3"
zip = { version = "6.0.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
zeroize = "1.9.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
